services:
  searxng:
    image: docker.io/searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:rw
    ports:
      - 4000:8080
    networks:
      - acadist-network
    restart: unless-stopped

  acadist-backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    image: itzcrazykns1337/acadist-backend:main
    environment:
      - SEARXNG_API_URL=http://searxng:8080
    depends_on:
      - searxng
    ports:
      - 3001:3001
    volumes:
      - backend-dbstore:/home/acadist/data
      - uploads:/home/acadist/uploads
      - ./config.toml:/home/acadist/config.toml
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - acadist-network
    restart: unless-stopped

  acadist-frontend:
    build:
      context: .
      dockerfile: app.dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://127.0.0.1:3001/api
        - NEXT_PUBLIC_WS_URL=ws://127.0.0.1:3001
    image: itzcrazykns1337/acadist-frontend:main
    depends_on:
      - acadist-backend
    ports:
      - 3000:3000
    networks:
      - acadist-network
    restart: unless-stopped

networks:
  acadist-network:


volumes:
  backend-dbstore:
  uploads:
